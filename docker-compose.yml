version: '3.8'

services:
  ara-dashboard:
    build: .
    container_name: ara-dashboard-prod
    restart: unless-stopped
    ports:
      - "3000:3000"   # host:container — Next.js must listen on 7000 inside (see PORT below)
    volumes:
      - ara_pgdata:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  ara_pgdata:
